/* Street-sign HUD: warm enamel and dark asphalt, readable through overcast skies. */
#hud>div{border:1px solid #e0c8a6bd;border-radius:12px 16px 12px 16px;background:linear-gradient(155deg,#254656ed,#173547e8);box-shadow:0 4px 0 #0d293b6e,0 9px 22px #0d293b66,inset 0 1px 0 #f4e5c951;padding:7px 12px}
#hud small{font-family:Trebuchet MS,system-ui,sans-serif;font-size:9px;letter-spacing:.15em;color:#f0d8b3}
#hud span{font-variant-numeric:tabular-nums;color:#fff3d4}
#stageName{display:inline-block;padding:4px 13px 3px;border:1px solid #e9d3ae9c;border-radius:5px 11px 5px 11px;background:#1d4053ed;color:#fff1cf;box-shadow:0 3px 0 #0e2b3a8a}
#track{height:7px;border:1px solid #f3d6a8a6;background:#153447dd;box-shadow:0 2px 6px #061d2978}
#fill{background:linear-gradient(90deg,#dc8c61,#ffd693);box-shadow:0 0 5px #f7c08392}
#menu{border-color:#e8d4b0a6;border-radius:8px 14px 8px 14px;background:linear-gradient(155deg,#254b5bef,#143446ed);box-shadow:0 3px 0 #0d29388a}

/* Four-character selection uses the same touch scale and panel language. */
#charactersButton{display:block;width:min(100%,292px);margin:9px auto;background:#f6c783;color:#233b41;box-shadow:0 4px 0 #9b693e}
#charactersView{max-height:min(52dvh,470px);overflow:auto;scrollbar-width:thin;padding:2px 3px 9px}
.character-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.character-card{min-width:0;min-height:174px!important;padding:8px 6px!important;border:1px solid #a8d4c1;border-radius:14px;background:linear-gradient(155deg,#2b5260,#173845);color:#fff3d5;box-shadow:0 3px 0 #0b2430;text-align:center;letter-spacing:0}
.character-card.current{outline:3px solid #ffd48b;outline-offset:-3px}
.character-card.locked{filter:saturate(.65)}.character-card.locked canvas{filter:grayscale(1) brightness(.29)}
.character-card canvas{display:block;width:76px;height:101px;margin:auto}
.character-card strong{display:block;font-size:15px}.character-card small{display:block;font-size:11px;color:#d9e8d8;line-height:1.25;margin-top:4px}
.character-progress{height:5px;margin:6px 8px 0;border-radius:5px;background:#102b32;overflow:hidden}.character-progress i{display:block;height:100%;background:#ffd389}

}
